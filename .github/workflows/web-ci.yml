name: Web CI

on:
  push:
    branches: [personal]
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '*config*'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '*config*'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          DOCKER_BUILD: '1'

      - name: Package Linux server
        if: github.event_name != 'pull_request'
        run: |
          cp -r public config .next/standalone/
          rm -f .next/standalone/config/family-accounts.json.age
          cp -r .next/static .next/standalone/.next/
          printf '%s\n' "$GITHUB_SHA" > .next/standalone/REVISION
          tar -C .next/standalone -czf "$RUNNER_TEMP/hometv.tgz" .
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: hometv-linux-${{ github.sha }}
          path: ${{ runner.temp }}/hometv.tgz
          retention-days: 14
